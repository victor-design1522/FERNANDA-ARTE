<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Golden Brown - Partitura Oficial</title>
<style>
  :root {
    --bg-color: #1a0f08;
    --wood-light: #5c3a21;
    --wood-dark: #2c1a0f;
    --gold: #d4af37;
    --gold-glow: rgba(212, 175, 55, 0.8);
    --ivory: #fffff0;
    --ebony: #1c1c1c;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-touch-callout: none;
    user-select: none;
  }

  body {
    background: radial-gradient(circle at center, var(--wood-light), var(--bg-color));
    color: var(--gold);
    font-family: 'Georgia', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    padding: 10px;
  }

  .header {
    text-align: center;
    margin-bottom: 10px;
  }

  h1 {
    font-size: 1.6em;
    letter-spacing: 1px;
    text-shadow: 0 2px 10px var(--gold-glow);
    margin-bottom: 4px;
    font-style: italic;
  }

  .subtitle {
    font-size: 0.85em;
    color: #e8d08d;
    margin-bottom: 10px;
    opacity: 0.9;
  }

  button {
    background: linear-gradient(to bottom, #d4af37, #997a00);
    color: #1a0f08;
    border: 2px solid #fff;
    padding: 8px 20px;
    font-size: 1em;
    font-weight: bold;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    margin-bottom: 15px;
  }

  button:active {
    transform: scale(0.95);
  }

  /* Painel da Esteira de Notas (Arranjo de Łucja Falińska) */
  .lesson-panel {
    width: 100%;
    max-width: 650px;
    height: 45px;
    background: rgba(0, 0, 0, 0.7);
    border: 2px solid var(--gold);
    border-radius: 8px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    overflow-x: auto;
    white-space: nowrap;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
  }

  .lesson-note {
    display: inline-block;
    background: #3e271a;
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 4px 8px;
    margin-right: 5px;
    border-radius: 4px;
    font-weight: bold;
    font-size: 0.8em;
  }

  .lesson-note.current {
    background: var(--gold);
    color: #000;
    transform: scale(1.1);
    box-shadow: 0 0 10px var(--gold);
  }

  .piano-wrapper {
    background: linear-gradient(to bottom, var(--wood-dark), #110905);
    padding: 15px;
    border-radius: 12px;
    border: 3px solid var(--gold);
    box-shadow: 0 15px 40px rgba(0,0,0,0.8);
    width: 100%;
    max-width: 750px;
    touch-action: none;
  }

  .piano {
    position: relative;
    display: flex;
    height: 32vh;
    min-height: 180px;
  }

  .key {
    position: relative;
    border-radius: 0 0 6px 6px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 8px;
    font-size: 0.7em;
    color: rgba(0,0,0,0.4);
    font-weight: bold;
  }

  .key.white {
    flex: 1;
    background: linear-gradient(to bottom, #fff, var(--ivory));
    border: 1px solid #ccc;
    border-bottom: 4px solid #bbb;
    z-index: 1;
  }

  .key.white:active, .key.white.active {
    background: linear-gradient(to bottom, var(--ivory), #e6e6dc);
    transform: translateY(2px);
  }

  .key.black {
    width: 5.5%;
    height: 60%;
    background: linear-gradient(to bottom, #333, var(--ebony));
    border: 1px solid #000;
    border-bottom: 3px solid #111;
    position: absolute;
    z-index: 2;
    color: rgba(255,255,255,0.4);
    transform: translateX(-50%);
  }

  .key.black:active, .key.black.active {
    background: linear-gradient(to bottom, #222, #000);
  }

  .key.guide {
    box-shadow: inset 0 0 20px var(--gold);
  }

  .key.white.guide {
    border: 2px solid var(--gold);
  }

  .key.guide::before {
    content: '▼';
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--gold);
    font-size: 18px;
    animation: bounce 0.6s infinite alternate;
    z-index: 10;
  }

  @keyframes bounce {
    from { top: -22px; }
    to { top: -10px; }
  }
</style>
</head>
<body>

  <div class="header">
    <h1>Golden Brown</h1>
    <div class="subtitle">Arranjo de Łucja Falińska</div>
    <button id="start-btn" onclick="iniciarAula()">Tocar Partitura</button>
  </div>

  <div class="lesson-panel" id="lesson-panel"></div>

  <div class="piano-wrapper">
    <div class="piano" id="piano"></div>
  </div>

<script>
let audioCtx;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

// Sintetizador de Cravo com timbre metálico aprimorado
function playHarpsichord(freq) {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();

  osc.type = 'sawtooth';
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(4500, audioCtx.currentTime);
  filter.frequency.exponentialRampType = 'exponential';
  filter.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);

  osc.connect(filter);
  filter.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

  gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
  gainNode.gain.linearRampToValueAtTime(0.45, audioCtx.currentTime + 0.01);
  gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.9);

  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + 0.9);
}

// Escala de notas abrangendo a oitava da partitura
const notes = [
  { note: 'C4', freq: 261.63, type: 'white' },
  { note: 'C#4', freq: 277.18, type: 'black' },
  { note: 'D4', freq: 293.66, type: 'white' },
  { note: 'D#4', freq: 311.13, type: 'black' },
  { note: 'E4', freq: 329.63, type: 'white' },
  { note: 'F4', freq: 349.23, type: 'white' },
  { note: 'F#4', freq: 369.99, type: 'black' },
  { note: 'G4', freq: 392.00, type: 'white' },
  { note: 'G#4', freq: 415.30, type: 'black' },
  { note: 'A4', freq: 440.00, type: 'white' },
  { note: 'A#4', freq: 466.16, type: 'black' },
  { note: 'B4', freq: 493.88, type: 'white' },
  { note: 'C5', freq: 523.25, type: 'white' },
  { note: 'C#5', freq: 554.37, type: 'black' },
  { note: 'D5', freq: 587.33, type: 'white' },
  { note: 'D#5', freq: 622.25, type: 'black' },
  { note: 'E5', freq: 659.25, type: 'white' }
];

const piano = document.getElementById('piano');
let whiteKeyCount = 0;

notes.forEach(note => {
  const keyEl = document.createElement('div');
  keyEl.classList.add('key', note.type);
  keyEl.dataset.note = note.note;
  
  if (note.type === 'white') {
    whiteKeyCount++;
    keyEl.textContent = note.note.replace(/[0-9]/g, '');
  } else {
    keyEl.style.left = `calc(${whiteKeyCount} * (100% / 10))`;
  }

  const pressKey = (e) => {
    if (e) e.preventDefault();
    playHarpsichord(note.freq);
    keyEl.classList.add('active');
    
    if (aulaAtiva && note.note === melodiaAula[passoAtual]) {
      avancarAula();
    }
  };

  const releaseKey = (e) => {
    if (e) e.preventDefault();
    keyEl.classList.remove('active');
  };

  keyEl.addEventListener('pointerdown', pressKey);
  keyEl.addEventListener('pointerup', releaseKey);
  keyEl.addEventListener('pointerleave', releaseKey);
  
  piano.appendChild(keyEl);
});

// Sequência precisa baseada na partitura fornecida
let aulaAtiva = false;
let passoAtual = 0;
const lessonPanel = document.getElementById('lesson-panel');

const melodiaAula = [
  'F#4', 'B4', 'D5', 'F#4', 'B4', 'D5',
  'F#4', 'A4', 'C#5', 'F#4', 'A4', 'C#5',
  'E4', 'G4', 'B4', 'E4', 'G4', 'B4',
  'F#4', 'A4', 'C#5', 'F#4', 'A4', 'C#5', 'F#4', 'A4'
];

function iniciarAula() {
  initAudio();
  aulaAtiva = true;
  passoAtual = 0;
  document.getElementById('start-btn').textContent = "Reiniciar";
  atualizarInterfaceAula();
}

function atualizarInterfaceAula() {
  document.querySelectorAll('.key').forEach(k => k.classList.remove('guide'));
  lessonPanel.innerHTML = '';

  if (passoAtual >= melodiaAula.length) {
    lessonPanel.innerHTML = '<span style="color:var(--gold); font-weight:bold; width:100%; text-align:center;">Excelente! Você executou o arranjo.</span>';
    aulaAtiva = false;
    document.getElementById('start-btn').textContent = "Tocar Novamente";
    return;
  }

  const notaExata = melodiaAula[passoAtual];
  const teclaCerta = document.querySelector(`.key[data-note="${notaExata}"]`);
  if (teclaCerta) teclaCerta.classList.add('guide');

  for (let i = passoAtual; i < melodiaAula.length; i++) {
    const span = document.createElement('div');
    span.classList.add('lesson-note');
    if (i === passoAtual) span.classList.add('current');
    span.textContent = melodiaAula[i];
    lessonPanel.appendChild(span);
  }
}

function avancarAula() {
  passoAtual++;
  atualizarInterfaceAula();
}
</script>
</body>
</html>
