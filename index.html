<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP CORTE ANIME | V2</title>
    <style>
        :root {
            --bg-dark: #0f0f13;
            --bg-card: #1c1c24;
            --primary: #8a2be2;
            --neon: #b829ea;
            --text-main: #f0f0f0;
            --text-muted: #999;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background: var(--bg-dark); color: var(--text-main); }

        /* HEADER */
        header {
            background: linear-gradient(90deg, #110022, #2a0055);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.3);
        }

        header h1 { color: #fff; font-size: 24px; text-shadow: 0 0 10px var(--neon); cursor: pointer; }
        
        .btn-adm {
            background: #ff0055; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-adm:hover { box-shadow: 0 0 15px #ff0055; }

        /* CONTAINERS GERAIS */
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; display: none; }
        .container.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* HOME - BUSCA E GRID */
        .busca { width: 100%; padding: 15px; border-radius: 30px; border: 2px solid #333; background: var(--bg-card); color: white; margin-bottom: 30px; font-size: 16px; outline: none; }
        .busca:focus { border-color: var(--primary); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        
        .card { background: var(--bg-card); border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid #333; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 5px 15px rgba(138,43,226,0.3); }
        .card img { width: 100%; height: 300px; object-fit: cover; }
        .card-info { padding: 15px; text-align: center; }
        .card-info h3 { font-size: 16px; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-info p { color: var(--text-muted); font-size: 13px; }

        /* TELA DE ASSISTIR (PLAYER) */
        .voltar { background: transparent; border: 1px solid var(--primary); color: var(--text-main); padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-bottom: 20px; }
        .info-anime { display: flex; gap: 20px; margin-bottom: 30px; background: var(--bg-card); padding: 20px; border-radius: 12px; }
        .info-anime img { width: 200px; border-radius: 10px; }
        .video-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 20px; border: 1px solid #444; }
        video { width: 100%; height: 100%; }
        
        .lista-episodios { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
        .ep-btn { background: var(--bg-card); border: 1px solid #444; padding: 10px; color: white; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .ep-btn:hover, .ep-btn.ativo { background: var(--primary); border-color: var(--neon); }

        /* PAINEL ADM */
        .adm-header { display: flex; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .form-adm { background: var(--bg-card); padding: 20px; border-radius: 12px; margin-bottom: 30px; border: 1px solid var(--primary); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--neon); }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: var(--bg-dark); color: white; }
        .form-group textarea { resize: vertical; min-height: 100px; }
        .ajuda-texto { font-size: 12px; color: var(--text-muted); margin-top: 5px; }
        
        .btn-salvar { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-salvar:hover { background: var(--neon); }

        .lista-adm { width: 100%; border-collapse: collapse; }
        .lista-adm th, .lista-adm td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        .lista-adm th { background: var(--bg-card); color: var(--neon); }
        .btn-deletar { background: #ff0044; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }

        @media (max-width: 768px) {
            .info-anime { flex-direction: column; align-items: center; text-align: center; }
        }
    </style>
</head>
<body>

    <header>
        <h1 onclick="mudarTela('home')">🎬 TOP CORTE ANIME</h1>
        <button class="btn-adm" onclick="mudarTela('adm')">⚙️ Painel ADM</button>
    </header>

    <!-- TELA PRINCIPAL (HOME) -->
    <div id="tela-home" class="container active">
        <input type="text" class="busca" id="inputBusca" placeholder="Pesquisar anime..." oninput="filtrarAnimes()">
        <h2 style="margin-bottom: 20px; color: var(--neon);">🔥 Catálogo Completo</h2>
        <div class="grid" id="gridAnimes">
            <!-- Animes aparecem aqui -->
        </div>
    </div>

    <!-- TELA DE ASSISTIR -->
    <div id="tela-player" class="container">
        <button class="voltar" onclick="mudarTela('home')">⬅ Voltar ao Catálogo</button>
        
        <div class="info-anime">
            <img id="player-img" src="" alt="Capa">
            <div>
                <h2 id="player-titulo" style="color: var(--neon); font-size: 28px; margin-bottom: 10px;"></h2>
                <p id="player-sinopse" style="color: #ccc; line-height: 1.6;"></p>
            </div>
        </div>

        <h3 id="titulo-video" style="margin-bottom: 10px;">Selecione um episódio:</h3>
        <div class="video-container">
            <video id="video-player" controls></video>
        </div>

        <div class="lista-episodios" id="container-episodios">
            <!-- Botões de episódios aparecem aqui -->
        </div>
    </div>

    <!-- PAINEL ADM -->
    <div id="tela-adm" class="container">
        <div class="adm-header">
            <h2>⚙️ Painel de Administração</h2>
            <button class="voltar" onclick="mudarTela('home')">Sair do Painel</button>
        </div>

        <div class="form-adm">
            <h3>Adicionar Novo Anime</h3>
            <br>
            <div class="form-group">
                <label>Nome do Anime:</label>
                <input type="text" id="add-nome" placeholder="Ex: Toradora!">
            </div>
            <div class="form-group">
                <label>Link da Imagem (Capa):</label>
                <input type="text" id="add-img" placeholder="Cole a URL da imagem aqui">
            </div>
            <div class="form-group">
                <label>Sinopse:</label>
                <textarea id="add-sinopse" placeholder="Digite a história do anime..."></textarea>
            </div>
            <div class="form-group">
                <label>Links dos Vídeos (Episódios):</label>
                <textarea id="add-links" placeholder="Cole um link de vídeo por linha (terminando em .mp4)"></textarea>
                <div class="ajuda-texto">DICA: Aperte 'Enter' para colocar o link do próximo episódio na linha de baixo.</div>
            </div>
            <button class="btn-salvar" onclick="salvarAnime()">💾 SALVAR NOVO ANIME</button>
        </div>

        <h3>Animes Cadastrados</h3>
        <br>
        <table class="lista-adm">
            <thead>
                <tr>
                    <th>Capa</th>
                    <th>Nome</th>
                    <th>Episódios</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="tabela-adm">
                <!-- Tabela gerada pelo JS -->
            </tbody>
        </table>
    </div>

    <script>
        // --- BANCO DE DADOS LOCAL ---
        // Ele tenta pegar os animes salvos. Se não tiver nenhum, ele cria um de exemplo.
        let bancoAnimes = JSON.parse(localStorage.getItem('bd_animes')) || [
            {
                id: 1,
                nome: "Exemplo Anime (Pode Apagar)",
                img: "https://via.placeholder.com/220x300/8a2be2/ffffff?text=Capa+Exemplo",
                sinopse: "Este é um anime de exemplo criado pelo sistema. Você pode excluí-lo no Painel ADM.",
                episodios: [
                    "https://www.w3schools.com/html/mov_bbb.mp4",
                    "https://www.w3schools.com/html/mov_bbb.mp4"
                ]
            }
        ];

        function salvarNoBanco() {
            localStorage.setItem('bd_animes', JSON.stringify(bancoAnimes));
        }

        // --- SISTEMA DE NAVEGAÇÃO ---
        function mudarTela(telaId) {
            document.querySelectorAll('.container').forEach(tela => tela.classList.remove('active'));
            document.getElementById('tela-' + telaId).classList.add('active');
            
            // Pausa o vídeo se sair da tela do player
            if(telaId !== 'player') {
                document.getElementById('video-player').pause();
            }

            if(telaId === 'home') carregarHome();
            if(telaId === 'adm') carregarAdm();
        }

        // --- TELA HOME (CATÁLOGO) ---
        function carregarHome() {
            const grid = document.getElementById('gridAnimes');
            grid.innerHTML = '';

            if(bancoAnimes.length === 0) {
                grid.innerHTML = '<p style="color: #999;">Nenhum anime cadastrado ainda. Vá no Painel ADM e adicione!</p>';
                return;
            }

            bancoAnimes.forEach(anime => {
                const card = document.createElement('div');
                card.className = 'card anime-item';
                card.dataset.nome = anime.nome.toLowerCase();
                card.onclick = () => abrirPlayer(anime.id);
                
                card.innerHTML = `
                    <img src="${anime.img}" alt="${anime.nome}">
                    <div class="card-info">
                        <h3>${anime.nome}</h3>
                        <p>${anime.episodios.length} Episódios</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filtrarAnimes() {
            const termo = document.getElementById('inputBusca').value.toLowerCase();
            document.querySelectorAll('.anime-item').forEach(card => {
                if(card.dataset.nome.includes(termo)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // --- TELA PLAYER (ASSISTIR) ---
        function abrirPlayer(idAnime) {
            const anime = bancoAnimes.find(a => a.id === idAnime);
            if(!anime) return;

            document.getElementById('player-img').src = anime.img;
            document.getElementById('player-titulo').textContent = anime.nome;
            document.getElementById('player-sinopse').textContent = anime.sinopse;
            
            const containerEps = document.getElementById('container-episodios');
            containerEps.innerHTML = '';
            
            const video = document.getElementById('video-player');
            const tituloVideo = document.getElementById('titulo-video');

            // Reseta o player
            video.src = '';
            tituloVideo.textContent = 'Selecione um episódio abaixo:';

            anime.episodios.forEach((link, index) => {
                const num = index + 1;
                const btn = document.createElement('button');
                btn.className = 'ep-btn';
                btn.textContent = `Episódio ${num}`;
                
                btn.onclick = () => {
                    document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('ativo'));
                    btn.classList.add('ativo');
                    video.src = link;
                    tituloVideo.textContent = `Reproduzindo: Episódio ${num}`;
                    video.play().catch(e => console.log('Autoplay bloqueado'));
                };

                containerEps.appendChild(btn);
            });

            mudarTela('player');
            window.scrollTo(0,0);
        }

        // --- PAINEL ADM ---
        function carregarAdm() {
            const tabela = document.getElementById('tabela-adm');
            tabela.innerHTML = '';

            bancoAnimes.forEach(anime => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><img src="${anime.img}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 5px;"></td>
                    <td><strong>${anime.nome}</strong></td>
                    <td>${anime.episodios.length} Eps</td>
                    <td><button class="btn-deletar" onclick="deletarAnime(${anime.id})">Apagar</button></td>
                `;
                tabela.appendChild(tr);
            });
        }

        function salvarAnime() {
            const nome = document.getElementById('add-nome').value.trim();
            const img = document.getElementById('add-img').value.trim();
            const sinopse = document.getElementById('add-sinopse').value.trim();
            const linksBrutos = document.getElementById('add-links').value;

            if(!nome || !img || !linksBrutos) {
                alert("Por favor, preencha o nome, a imagem e pelo menos um link de vídeo!");
                return;
            }

            // Separa os links por linha, remove os espaços vazios e tira linhas em branco
            const arrayLinks = linksBrutos.split('\n').map(l => l.trim()).filter(l => l.length > 0);

            const novoAnime = {
                id: Date.now(), // Gera um ID único baseado na data
                nome: nome,
                img: img,
                sinopse: sinopse,
                episodios: arrayLinks
            };

            bancoAnimes.push(novoAnime);
            salvarNoBanco();

            // Limpa o formulário
            document.getElementById('add-nome').value = '';
            document.getElementById('add-img').value = '';
            document.getElementById('add-sinopse').value = '';
            document.getElementById('add-links').value = '';

            alert("Anime adicionado com sucesso!");
            carregarAdm();
        }

        function deletarAnime(id) {
            if(confirm("Tem certeza que deseja apagar este anime?")) {
                bancoAnimes = bancoAnimes.filter(a => a.id !== id);
                salvarNoBanco();
                carregarAdm();
            }
        }

        // Inicia o site na tela Home
        carregarHome();
    </script>
</body>
        </html>
