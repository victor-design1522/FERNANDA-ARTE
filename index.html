<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cravo Guiado - Estilo Barroco</title>
<style>
  :root {
    --bg-color: #1a0f08;
    --wood-light: #5c3a21;
    --wood-dark: #2c1a0f;
    --gold: #d4af37;
    --gold-glow: rgba(212, 175, 55, 0.8);
    --ivory: #fffff0;
    --ebony: #1c1c1c;
    --guide-color: #4CAF50;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-touch-callout: none;
    user-select: none;
  }

  body {
    background: radial-gradient(circle at center, var(--wood-light), var(--bg-color));
    color: var(--gold);
    font-family: 'Georgia', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .header {
    text-align: center;
    margin-bottom: 15px;
    padding: 0 10px;
  }

  h1 {
    font-size: 1.8em;
    letter-spacing: 1px;
    text-shadow: 0 2px 10px var(--gold-glow);
    margin-bottom: 5px;
    font-style: italic;
  }

  button {
    background: linear-gradient(to bottom, #d4af37, #997a00);
    color: #1a0f08;
    border: 2px solid #fff;
    padding: 10px 25px;
    font-size: 1.1em;
    font-weight: bold;
    border-radius: 25px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    margin-bottom: 15px;
    transition: transform 0.1s;
  }

  button:active {
    transform: scale(0.95);
  }

  /* Painel de Ensino em Cima */
  .lesson-panel {
    width: 95%;
    max-width: 600px;
    height: 50px;
    background: rgba(0, 0, 0, 0.6);
    border: 2px solid var(--gold);
    border-radius: 8px;
    margin-bottom: 25px; /* Espaço para as setinhas do piano */
    display: flex;
    align-items: center;
    padding: 0 10px;
    overflow: hidden;
    white-space: nowrap;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
  }

  .lesson-note {
    display: inline-block;
    background: var(--gold);
    color: #000;
    padding: 5px 12px;
    margin-right: 8px;
    border-radius: 4px;
    font-weight: bold;
    font-size: 0.9em;
    transition: all 0.3s ease;
  }

  .lesson-note.current {
    background: var(--guide-color);
    color: white;
    transform: scale(1.1);
    box-shadow: 0 0 10px var(--guide-color);
  }

  .piano-wrapper {
    background: linear-gradient(to bottom, var(--wood-dark), #110905);
    padding: 15px 15px 25px 15px;
    border-radius: 12px;
    border: 3px solid var(--gold);
    box-shadow: 0 15px 40px rgba(0,0,0,0.8);
    width: 95%;
    max-width: 800px;
    touch-action: none;
  }

  .piano {
    position: relative;
    display: flex;
    height: 35vh;
    min-height: 200px;
  }

  .key {
    position: relative;
    border-radius: 0 0 6px 6px;
    cursor: pointer;
    transition: background 0.1s, box-shadow 0.1s;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 10px;
    font-size: 0.8em;
    color: rgba(0,0,0,0.5);
    font-weight: bold;
  }

  /* Teclas Brancas */
  .key.white {
    flex: 1; /* Distribui as 10 teclas brancas igualmente */
    background: linear-gradient(to bottom, #fff, var(--ivory));
    border: 1px solid #ccc;
    border-bottom: 4px solid #bbb;
    box-shadow: inset 0 1px 0 #fff, 0 2px 4px rgba(0,0,0,0.4);
    z-index: 1;
  }

  .key.white:active, .key.white.active {
    background: linear-gradient(to bottom, var(--ivory), #e6e6dc);
    border-bottom: 2px solid #999;
    transform: translateY(2px);
  }

  /* Teclas Pretas */
  .key.black {
    width: 6%;
    height: 60%;
    background: linear-gradient(to bottom, #333, var(--ebony));
    border: 1px solid #000;
    border-bottom: 3px solid #111;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.6);
    position: absolute;
    z-index: 2;
    color: rgba(255,255,255,0.4);
    transform: translateX(-50%);
  }

  .key.black:active, .key.black.active {
    background: linear-gradient(to bottom, #222, #000);
    border-bottom: 1px solid #000;
  }

  /* EFEITOS DE AULA (A mágica visual) */
  .key.guide {
    box-shadow: inset 0 0 20px var(--guide-color);
  }

  .key.white.guide {
    border: 2px solid var(--guide-color);
  }

  /* Seta apontando para a tecla */
  .key.guide::before {
    content: '▼';
    position: absolute;
    top: -25px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--guide-color);
    font-size: 20px;
    text-shadow: 0 0 8px #000;
    animation: bounce 0.6s infinite alternate;
    z-index: 10;
  }

  @keyframes bounce {
    from { top: -25px; }
    to { top: -10px; }
  }

</style>
</head>
<body>

  <div class="header">
    <h1>Harpsichord Guiado</h1>
    <button id="start-btn" onclick="iniciarAula()">Aprender Melodia</button>
  </div>

  <!-- A barra em cima ensinando o que tocar -->
  <div class="lesson-panel" id="lesson-panel">
    <!-- Notas aparecerão aqui -->
  </div>

  <div class="piano-wrapper">
    <div class="piano" id="piano">
      <!-- Teclas geradas via JS -->
    </div>
  </div>

<script>
let audioCtx;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

// Som de cravo (Harpsichord)
function playHarpsichord(freq) {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();

  osc.type = 'sawtooth';
  
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(3500, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);

  osc.connect(filter);
  filter.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

  gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
  gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.01);
  gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.0);

  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + 1.0);
}

// 10 Teclas brancas e 7 pretas (C4 a E5)
const notes = [
  { note: 'C4', freq: 261.63, type: 'white' },
  { note: 'C#4', freq: 277.18, type: 'black' },
  { note: 'D4', freq: 293.66, type: 'white' },
  { note: 'D#4', freq: 311.13, type: 'black' },
  { note: 'E4', freq: 329.63, type: 'white' },
  { note: 'F4', freq: 349.23, type: 'white' },
  { note: 'F#4', freq: 369.99, type: 'black' },
  { note: 'G4', freq: 392.00, type: 'white' },
  { note: 'G#4', freq: 415.30, type: 'black' },
  { note: 'A4', freq: 440.00, type: 'white' },
  { note: 'A#4', freq: 466.16, type: 'black' },
  { note: 'B4', freq: 493.88, type: 'white' },
  { note: 'C5', freq: 523.25, type: 'white' },
  { note: 'C#5', freq: 554.37, type: 'black' },
  { note: 'D5', freq: 587.33, type: 'white' },
  { note: 'D#5', freq: 622.25, type: 'black' },
  { note: 'E5', freq: 659.25, type: 'white' }
];

const piano = document.getElementById('piano');
let whiteKeyCount = 0;

// Renderizar o piano na tela
notes.forEach(note => {
  const keyEl = document.createElement('div');
  keyEl.classList.add('key', note.type);
  keyEl.dataset.note = note.note;
  
  if (note.type === 'white') {
    whiteKeyCount++;
    // Coloca o nome da nota na tecla branca para ajudar
    keyEl.textContent = note.note.replace('4', '').replace('5', ''); 
  } else {
    // Posiciona as pretas no meio-termo das brancas
    keyEl.style.left = `calc(${whiteKeyCount} * 10%)`; 
  }

  // Tocar a nota
  const pressKey = (e) => {
    if (e) e.preventDefault();
    playHarpsichord(note.freq);
    keyEl.classList.add('active');
    
    // Verifica se acertou a nota da aula
    if (aulaAtiva && note.note === melodiaAula[passoAtual]) {
      avancarAula();
    }
  };

  const releaseKey = (e) => {
    if (e) e.preventDefault();
    keyEl.classList.remove('active');
  };

  keyEl.addEventListener('pointerdown', pressKey);
  keyEl.addEventListener('pointerup', releaseKey);
  keyEl.addEventListener('pointerleave', releaseKey);
  
  piano.appendChild(keyEl);
});

// --- LÓGICA DO MODO AULA ---
let aulaAtiva = false;
let passoAtual = 0;
const lessonPanel = document.getElementById('lesson-panel');

// Uma melodia barroca hipnótica, lenta e fácil
const melodiaAula = [
  'D4', 'F4', 'A4', 'F4',
  'E4', 'G#4', 'B4', 'G#4',
  'F4', 'A4', 'C5', 'A4',
  'E4', 'G#4', 'B4', 'E5'
];

function iniciarAula() {
  initAudio(); // Libera o som do navegador
  aulaAtiva = true;
  passoAtual = 0;
  
  document.getElementById('start-btn').textContent = "Reiniciar Melodia";
  
  atualizarInterfaceAula();
}

function atualizarInterfaceAula() {
  // Limpa tudo
  document.querySelectorAll('.key').forEach(k => k.classList.remove('guide'));
  lessonPanel.innerHTML = '';

  if (passoAtual >= melodiaAula.length) {
    // Terminou!
    lessonPanel.innerHTML = '<span style="color:var(--guide-color); font-weight:bold; width:100%; text-align:center;">Parabéns! Você tocou a melodia.</span>';
    aulaAtiva = false;
    return;
  }

  // 1. Destaca a tecla certa no piano (a seta aparece pelo CSS)
  const notaExata = melodiaAula[passoAtual];
  const teclaCerta = document.querySelector(`.key[data-note="${notaExata}"]`);
  if (teclaCerta) teclaCerta.classList.add('guide');

  // 2. Cria a esteira de notas em cima
  for (let i = passoAtual; i < melodiaAula.length; i++) {
    const span = document.createElement('div');
    span.classList.add('lesson-note');
    if (i === passoAtual) span.classList.add('current');
    
    // Tira o número para ficar mais fácil de ler (D4 vira D)
    span.textContent = melodiaAula[i].replace(/[0-9]/g, '');
    lessonPanel.appendChild(span);
  }
}

function avancarAula() {
  passoAtual++;
  atualizarInterfaceAula();
}
</script>
</body>
</html>
