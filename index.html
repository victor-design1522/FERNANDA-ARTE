<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP CORTE ANIME | PRO</title>
    <style>
        :root {
            --bg-dark: #0f0f13;
            --bg-card: rgba(28, 28, 36, 0.85);
            --primary: #8a2be2;
            --neon: #b829ea;
            --text-main: #f0f0f0;
            --text-muted: #aaa;
            --success: #00ff88;
            --warning: #ffaa00;
            --danger: #ff0055;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* IMAGEM DE FUNDO AQUI */
        /* Se quiser trocar o fundo, mude o link da imagem abaixo: */
        body { 
            background: linear-gradient(rgba(15, 15, 19, 0.8), rgba(15, 15, 19, 0.95)), 
                        url('https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=2000') center/cover fixed; 
            color: var(--text-main); 
            min-height: 100vh;
        }

        /* LOADING SCREEN */
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #333;
            border-top-color: var(--neon); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* HEADER */
        header {
            background: rgba(17, 0, 34, 0.9); backdrop-filter: blur(10px);
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--primary); box-shadow: 0 0 20px rgba(138, 43, 226, 0.5);
            position: sticky; top: 0; z-index: 100;
        }
        header h1 { color: #fff; font-size: 24px; text-shadow: 0 0 10px var(--neon); cursor: pointer; }
        .header-botoes button { padding: 8px 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-left: 10px; transition: 0.3s; }
        .btn-fav-header { background: #333; color: white; }
        .btn-fav-header:hover { background: var(--warning); color: #000; }
        .btn-adm { background: var(--danger); color: white; }
        .btn-adm:hover { box-shadow: 0 0 15px var(--danger); }

        /* CONTAINERS GERAIS */
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; display: none; }
        .container.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* TELA DE LOGIN ADM */
        .form-login { max-width: 400px; margin: 80px auto; background: var(--bg-card); padding: 30px; border-radius: 12px; border: 1px solid var(--primary); text-align: center; }
        .form-login input { width: 100%; padding: 15px; margin: 15px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; }
        .btn-entrar { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* HOME - BUSCA E CATEGORIAS */
        .busca-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .busca { flex: 1; padding: 15px; border-radius: 30px; border: 2px solid #444; background: var(--bg-card); color: white; font-size: 16px; outline: none; }
        .busca:focus { border-color: var(--primary); }
        .filtros-genero { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
        .btn-filtro { background: var(--bg-card); border: 1px solid #555; color: white; padding: 8px 15px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
        .btn-filtro.ativo { background: var(--primary); border-color: var(--neon); box-shadow: 0 0 10px var(--neon); }

        /* GRID ANIMES */
        .sessao-titulo { margin: 20px 0 15px; color: var(--neon); display: flex; align-items: center; gap: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        
        .card { background: var(--bg-card); border-radius: 12px; overflow: hidden; position: relative; cursor: pointer; border: 1px solid #333; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 5px 15px rgba(138,43,226,0.3); }
        .card img { width: 100%; height: 280px; object-fit: cover; }
        
        .badge-status { position: absolute; top: 10px; left: 10px; background: var(--primary); color: white; font-size: 11px; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .btn-fav-card { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); border: none; font-size: 20px; color: white; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }
        .btn-fav-card.favoritado { color: var(--danger); text-shadow: 0 0 5px var(--danger); }

        .card-info { padding: 15px; }
        .card-info h3 { font-size: 16px; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-info p { color: var(--text-muted); font-size: 13px; display: flex; justify-content: space-between; }
        .card-tags { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
        .tag { background: #333; padding: 3px 6px; border-radius: 4px; font-size: 10px; color: #ccc; }

        /* TELA DE ASSISTIR (PLAYER) */
        .voltar { background: transparent; border: 1px solid var(--primary); color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-bottom: 20px; }
        .voltar:hover { background: var(--primary); }
        
        .info-anime { display: flex; gap: 20px; margin-bottom: 30px; background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid #333; }
        .info-anime img { width: 220px; border-radius: 10px; object-fit: cover; }
        .info-detalhes { flex: 1; }
        .meta-info { margin: 10px 0; color: var(--text-muted); font-size: 14px; display: flex; gap: 15px; flex-wrap: wrap; }
        
        .estrelas { font-size: 24px; color: #555; cursor: pointer; margin-top: 10px; }
        .estrelas span { transition: color 0.2s; }
        .estrelas span:hover, .estrelas span.ativo { color: var(--warning); text-shadow: 0 0 10px var(--warning); }

        .video-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 15px; border: 1px solid var(--primary); box-shadow: 0 0 15px rgba(138,43,226,0.2); }
        video { width: 100%; height: 100%; }
        
        .controles-player { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-nav-ep { background: #333; border: 1px solid #555; color: white; padding: 10px 15px; border-radius: 8px; cursor: pointer; }
        .btn-nav-ep:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-nav-ep:not(:disabled):hover { background: var(--primary); border-color: var(--neon); }

        .lista-episodios { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; max-height: 400px; overflow-y: auto; padding-right: 10px; }
        .ep-btn { background: #2a2a35; border: 1px solid #444; padding: 12px; color: white; border-radius: 8px; cursor: pointer; transition: 0.2s; position: relative; }
        .ep-btn:hover { background: #3a3a45; }
        .ep-btn.ativo { background: var(--primary); border-color: var(--neon); box-shadow: 0 0 10px rgba(138,43,226,0.5); }
        .ep-btn.visto { border-left: 4px solid var(--success); }

        /* PAINEL ADM */
        .form-adm { background: var(--bg-card); padding: 25px; border-radius: 12px; margin-bottom: 30px; border: 1px solid var(--primary); }
        .linha-dupla { display: flex; gap: 20px; }
        .linha-dupla .form-group { flex: 1; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--neon); font-weight: bold; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #555; background: #111; color: white; }
        .form-group textarea { resize: vertical; min-height: 100px; }
        
        .btn-salvar { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-salvar:hover { background: var(--neon); box-shadow: 0 0 15px var(--neon); }
        .btn-cancelar { background: #555; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; margin-top: 10px; cursor: pointer; display: none; }

        .lista-adm { width: 100%; border-collapse: collapse; background: var(--bg-card); border-radius: 12px; overflow: hidden; }
        .lista-adm th, .lista-adm td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        .lista-adm th { background: #222; color: var(--neon); }
        .btn-acao { padding: 5px 10px; border-radius: 5px; border: none; color: white; cursor: pointer; margin-right: 5px; }
        .btn-edit { background: var(--warning); color: #000; font-weight: bold; }
        .btn-del { background: var(--danger); }

        /* VOLTAR AO TOPO */
        #btn-topo { position: fixed; bottom: 30px; right: 30px; background: var(--primary); color: white; width: 50px; height: 50px; border-radius: 50%; font-size: 24px; border: none; cursor: pointer; display: none; box-shadow: 0 0 15px var(--neon); z-index: 1000; }
        
        @media (max-width: 768px) {
            .info-anime { flex-direction: column; align-items: center; text-align: center; }
            .linha-dupla { flex-direction: column; gap: 0; }
            .meta-info { justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- TELA DE LOADING -->
    <div id="loading">
        <div class="spinner"></div>
        <h2 style="color: var(--neon); text-shadow: 0 0 10px var(--primary);">CARREGANDO...</h2>
    </div>

    <!-- CABEÇALHO -->
    <header>
        <h1 onclick="mudarTela('home'); renderizarHome();">🎬 TOP CORTE ANIME</h1>
        <div class="header-botoes">
            <button class="btn-fav-header" onclick="mostrarFavoritos()">❤️ Minha Lista</button>
            <button class="btn-adm" onclick="abrirTelaLogin()">⚙️ ADM</button>
        </div>
    </header>

    <!-- TELA DE LOGIN -->
    <div id="tela-login" class="container">
        <button class="voltar" onclick="mudarTela('home')">⬅ Voltar</button>
        <div class="form-login">
            <h2>Acesso Restrito</h2>
            <input type="text" id="login-user" placeholder="Usuário">
            <input type="password" id="login-senha" placeholder="Senha">
            <button class="btn-entrar" onclick="fazerLogin()">ENTRAR NO PAINEL</button>
            <p id="msg-erro" style="color: var(--danger); margin-top: 10px; display: none;">Dados incorretos!</p>
        </div>
    </div>

    <!-- TELA PRINCIPAL (HOME) -->
    <div id="tela-home" class="container active">
        <div class="busca-container">
            <input type="text" class="busca" id="inputBusca" placeholder="Pesquisar anime..." oninput="filtrarAnimesBusca()">
        </div>
        
        <div class="filtros-genero" id="container-filtros">
            <!-- Filtros gerados pelo JS -->
        </div>

        <!-- Seção Favoritos (só aparece se clicar em Minha Lista) -->
        <div id="sessao-favoritos" style="display: none;">
            <h2 class="sessao-titulo">❤️ Seus Favoritos</h2>
            <div class="grid" id="gridFavoritos"></div>
            <hr style="border: 1px solid #333; margin: 30px 0;">
        </div>

        <h2 class="sessao-titulo">🔥 Catálogo Completo</h2>
        <div class="grid" id="gridAnimes">
            <!-- Cards gerados pelo JS -->
        </div>
    </div>

    <!-- TELA DE PLAYER -->
    <div id="tela-player" class="container">
        <button class="voltar" onclick="mudarTela('home'); renderizarHome();">⬅ Voltar ao Catálogo</button>
        
        <div class="info-anime">
            <img id="player-img" src="" alt="Capa">
            <div class="info-detalhes">
                <h2 id="player-titulo" style="color: var(--neon); font-size: 32px; margin-bottom: 5px;"></h2>
                <div class="meta-info">
                    <span id="player-ano">📅 2024</span>
                    <span id="player-status">🟢 Em Lançamento</span>
                    <span id="player-views">👁️ 0 views</span>
                </div>
                <div class="card-tags" id="player-tags" style="margin-bottom: 15px;"></div>
                <p id="player-sinopse" style="color: #ccc; line-height: 1.6;"></p>
                
                <div class="estrelas" id="player-estrelas">
                    Avalie: 
                    <span onclick="avaliarAnime(1)">★</span>
                    <span onclick="avaliarAnime(2)">★</span>
                    <span onclick="avaliarAnime(3)">★</span>
                    <span onclick="avaliarAnime(4)">★</span>
                    <span onclick="avaliarAnime(5)">★</span>
                </div>
            </div>
        </div>

        <h3 id="titulo-video" style="margin-bottom: 10px; color: var(--primary);">Selecione um episódio</h3>
        <div class="video-container">
            <video id="video-player" controls onended="proximoEpisodio()"></video>
        </div>
        
        <div class="controles-player">
            <button class="btn-nav-ep" id="btn-ep-ant" onclick="mudarEpisodio(-1)">⏮ Episódio Anterior</button>
            <button class="btn-nav-ep" id="btn-ep-prox" onclick="mudarEpisodio(1)">Próximo Episódio ⏭</button>
        </div>

        <div class="lista-episodios" id="container-episodios"></div>
    </div>

    <!-- PAINEL ADM -->
    <div id="tela-adm" class="container">
        <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <h2 style="color: var(--neon);">⚙️ Painel de Administração</h2>
            <button class="voltar" style="margin:0;" onclick="sairAdm()">Sair</button>
        </div>

        <div class="form-adm">
            <h3 id="adm-form-titulo">Adicionar Novo Anime</h3>
            <input type="hidden" id="edit-id">
            
            <div class="linha-dupla">
                <div class="form-group">
                    <label>Nome do Anime:</label>
                    <input type="text" id="add-nome" placeholder="Ex: Solo Leveling">
                </div>
                <div class="form-group">
                    <label>Link da Capa:</label>
                    <input type="text" id="add-img" placeholder="URL da imagem">
                </div>
            </div>

            <div class="linha-dupla">
                <div class="form-group">
                    <label>Ano de Lançamento:</label>
                    <input type="number" id="add-ano" placeholder="Ex: 2024">
                </div>
                <div class="form-group">
                    <label>Status:</label>
                    <select id="add-status">
                        <option value="Em Lançamento">Em Lançamento</option>
                        <option value="Finalizado">Finalizado</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Gêneros (separados por vírgula):</label>
                <input type="text" id="add-generos" placeholder="Ex: Ação, Romance, Fantasia">
            </div>

            <div class="form-group">
                <label>Sinopse:</label>
                <textarea id="add-sinopse" placeholder="História do anime..."></textarea>
            </div>

            <div class="form-group">
                <label>Links dos Vídeos (Um por linha):</label>
                <textarea id="add-links" placeholder="https://link.mp4&#10;https://link2.mp4"></textarea>
            </div>

            <button class="btn-salvar" onclick="salvarAnime()">💾 SALVAR ANIME</button>
            <button class="btn-cancelar" id="btn-cancelar-edit" onclick="cancelarEdicao()">❌ Cancelar Edição</button>
        </div>

        <h3 style="margin-bottom: 15px;">Catálogo Atual</h3>
        <div style="overflow-x: auto;">
            <table class="lista-adm">
                <thead>
                    <tr>
                        <th>Capa</th>
                        <th>Nome</th>
                        <th>Eps</th>
                        <th>Views</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="tabela-adm"></tbody>
            </table>
        </div>
    </div>

    <!-- BOTÃO VOLTAR AO TOPO -->
    <button id="btn-topo" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">⬆</button>

    <script>
        // --- REMOVER LOADING APÓS CARREGAR ---
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
            }, 1200); // Fica 1.2s na tela
        };

        // --- SISTEMA DE ROLAGEM (BOTÃO TOPO) ---
        window.onscroll = () => {
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                document.getElementById("btn-topo").style.display = "block";
            } else {
                document.getElementById("btn-topo").style.display = "none";
            }
        };

        // --- DADOS E LOCAL STORAGE ---
        const USUARIO_CORRETO = "admin";
        const SENHA_CORRETA = "1234";
        let logado = false;
        
        // Banco de animes (V3 para não bugar com os antigos do teste passado)
        let bancoAnimes = JSON.parse(localStorage.getItem('bd_animes_v3')) || [];
        
        // Memória do usuário (Favoritos e Episódio parado)
        let userData = JSON.parse(localStorage.getItem('user_data')) || { favoritos: [], progresso: {} };

        // Cria anime de exemplo se banco estiver vazio
        if(bancoAnimes.length === 0) {
            bancoAnimes.push({
                id: Date.now(), nome: "Exemplo Isekai", img: "https://via.placeholder.com/300x400/8a2be2/fff?text=Capa+Anime",
                ano: 2024, status: "Em Lançamento", generos: ["Ação", "Isekai", "Fantasia"],
                sinopse: "Um garoto vai parar num mundo mágico. Este é um anime de exemplo, pode apagar no painel ADM.",
                episodios: ["https://www.w3schools.com/html/mov_bbb.mp4", "https://www.w3schools.com/html/mov_bbb.mp4"],
                views: 120, rating: 4
            });
            salvarBanco();
        }

        function salvarBanco() { localStorage.setItem('bd_animes_v3', JSON.stringify(bancoAnimes)); }
        function salvarUserData() { localStorage.setItem('user_data', JSON.stringify(userData)); }

        // --- NAVEGAÇÃO GERAL ---
        function mudarTela(telaId) {
            document.querySelectorAll('.container').forEach(t => t.classList.remove('active'));
            document.getElementById('tela-' + telaId).classList.add('active');
            
            if(telaId !== 'player') document.getElementById('video-player').pause();
            if(telaId === 'adm') carregarAdm();
        }

        // --- LOGIN ADM ---
        function abrirTelaLogin() {
            if (logado) { mudarTela('adm'); } 
            else { mudarTela('login'); docume
